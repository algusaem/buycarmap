  renderVals() {
    const accent = this.props.accent ?? '#C6FF3D';
    const onAccent = this.props.onAccent ?? '#0F0F10';
    const square = (this.props.corners ?? 'round') === 'square';
    const pill = square ? '4px' : '999px';
    const card = square ? '4px' : '22px';
    const glow = accent + '33';
    // the active criteria: «Filtros» counts them, and the quick filters they match are pressed (violet fill)
    const active = ['Diésel', 'Hasta 20.000 €', 'Automático', 'Últimas 24 h'];
    const filterCount = active.length;
    const filtersLabel = 'Filtros';
    const toggle = (on) => 'all: unset; cursor: pointer; flex-shrink: 0; box-sizing: border-box; height: 34px; padding: 0 14px; display: flex; align-items: center; border-radius: ' + pill + '; border: 1px solid ' + (on ? '#7C4DFF' : '#2A2A2E') + '; background: ' + (on ? '#7C4DFF' : 'transparent') + '; color: ' + (on ? '#FAF9F8' : '#F4F2F0') + '; font-size: 13px; font-weight: ' + (on ? 800 : 600) + '; white-space: nowrap';
    const quick = ['Gasolina', 'Diésel', 'Manual', 'Automático', 'Hasta 100.000 km'].map((label) => { const on = active.includes(label); return { label, pressed: String(on), style: toggle(on) }; });
    const tints = ['#2A2D33', '#302C2A', '#29302C', '#2D2A33', '#2A2F33', '#322E2A'];
    const cars = [
      { title: 'Audi A3 2.0 TDI', city: 'Madrid', year: '2018', km: '95.000 km', fuel: 'Diésel', price: '14.500 €', source: 'Wallapop' },
      { title: 'BMW Serie 3 320d', city: 'Barcelona', year: '2019', km: '120.000 km', fuel: 'Diésel', price: '18.900 €', source: 'coches.net', saved: true },
      { title: 'SEAT León 1.5 TSI', city: 'Sevilla', year: '2020', km: '64.000 km', fuel: 'Gasolina', price: '16.500 €', source: 'Milanuncios' },
      { title: 'VW Golf 1.6 TDI', city: 'Valencia', year: '2017', km: '132.000 km', fuel: 'Diésel', price: '11.900 €', source: 'Wallapop' },
      { title: 'Toyota Corolla 125H', city: 'Madrid', year: '2021', km: '48.000 km', fuel: 'Híbrido', price: '19.750 €', source: 'coches.net' },
      { title: 'Renault Clio TCe 90', city: 'Zaragoza', year: '2019', km: '71.000 km', fuel: 'Gasolina', price: '9.400 €', source: 'Wallapop' }
    ].map((c, i) => ({ ...c,
      photo: 'position: relative; aspect-ratio: 20 / 19; border-radius: ' + card + '; background: ' + tints[i] + '; display: flex; align-items: center; justify-content: center; color: rgba(244,242,240,0.2);' + (i === 2 ? ' box-shadow: 0 0 0 2px ' + accent + ';' : ''),
      heart: 'all: unset; cursor: pointer; position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: ' + pill + '; display: flex; align-items: center; justify-content: center; ' + (c.saved ? 'background: #7C4DFF; color: #FAF9F8;' : 'background: rgba(15,15,16,0.85); color: #F4F2F0;'),
      heartFill: c.saved ? '#FAF9F8' : 'none' }));
    const pin = (x, y, on) => 'all: unset; cursor: pointer; position: absolute; left: ' + (x / 562 * 100).toFixed(3) + '%; top: ' + (y / 701 * 100).toFixed(3) + '%; padding: 7px 13px; white-space: nowrap; border-radius: ' + pill + '; font-size: 14px; ' + (on ? 'font-weight: 800; background: ' + accent + '; color: ' + onAccent + '; box-shadow: 0 0 0 7px ' + glow + ';' : 'font-weight: 700; background: #18181B; color: #F4F2F0; border: 1px solid #2A2A2E;');
    const pins = [
      ['14.500 €', 120, 180, false], ['18.900 €', 420, 120, false], ['16.500 €', 260, 300, true], ['11.900 €', 470, 380, false],
      ['19.750 €', 90, 400, false], ['9.400 €', 360, 230, false], ['12.300 €', 200, 120, false], ['21.000 €', 480, 250, false]
    ].map(([label, x, y, on]) => ({ label, style: pin(x, y, on) }));
    return { accent, onAccent, violet: '#7C4DFF', onViolet: '#FAF9F8', pill, card, glow, filterCount, filtersLabel, quick, cars, pins };
  }
}
</script>
