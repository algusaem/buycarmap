<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ronda 3 · Mapa con coche abierto y filtros</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&amp;family=Rethink+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4F2F0}a:hover{color:#C6FF3D}
</style>
</helmet>
<div style="width: 1970px; height: 900px; position: relative; font-family: 'Rethink Sans', system-ui, sans-serif; color: #F4F2F0">
  <dc-import name="R2Base" accent="#C6FF3D" on-accent="#0F0F10" corners="round" hint-size="1970px,900px"></dc-import>

  <article aria-label="Vista previa del coche" style="position: absolute; left: 1000px; top: 492px; width: 340px; background: #18181B; border: 1px solid #2A2A2E; border-radius: 24px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 24px 50px rgba(0,0,0,0.55)">
    <div style="height: 170px; border-radius: 16px; background: #29302C; position: relative">
      <button type="button" aria-label="Cerrar vista previa" style="all: unset; cursor: pointer; position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 999px; background: rgba(15,15,16,0.85); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F4F2F0" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <span style="position: absolute; top: 12px; left: 12px; background: rgba(15,15,16,0.85); border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 700">Milanuncios</span>
      
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline"><strong style="font-size: 16px">SEAT León 1.5 TSI FR</strong><span style="font-size: 13px; color: #A3A0A6">Sevilla</span></div>
    <span style="font-size: 14px; color: #A3A0A6; margin-top: -6px">2020 · 64.000 km · Gasolina</span>
    <div style="display: flex; align-items: center; gap: 8px">
      <strong style="font-family: Unbounded, sans-serif; font-size: 24px; font-weight: 800; color: #C6FF3D; flex: 1; white-space: nowrap">16.500 €</strong>
      <button type="button" aria-label="Guardar" style="all: unset; cursor: pointer; width: 42px; height: 42px; border-radius: 999px; border: 1px solid #2A2A2E; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F4F2F0" stroke-width="2" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg></button>
      <a href="#" style="height: 42px; padding: 0 16px; border-radius: 999px; background: #C6FF3D; color: #0F0F10; display: flex; align-items: center; font-size: 14px; font-weight: 800; text-decoration: none">Ver anuncio<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left: 6px; flex-shrink: 0"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></a>
    </div>
  </article>

  <div role="dialog" aria-label="Filtros" style="position: absolute; left: 1530px; top: 28px; width: 390px; height: 844px; border-radius: 44px; background: #0F0F10; overflow: hidden; display: flex; flex-direction: column">
    <div style="height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #232326">
      <button type="button" aria-label="Cerrar filtros" style="all: unset; cursor: pointer; width: 40px; height: 40px; border-radius: 999px; border: 1px solid #2A2A2E; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F4F2F0" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <strong style="font-family: Unbounded, sans-serif; font-size: 16px; font-weight: 800; text-transform: uppercase">Filtros</strong>
      <button type="button" style="all: unset; cursor: pointer; font-size: 14px; font-weight: 700; text-decoration: underline">Borrar</button>
    </div>
    <div style="flex: 1; padding: 22px 20px; display: flex; flex-direction: column; gap: 26px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #A3A0A6">Precio</span>
        <div style="position: relative; height: 4px; background: #2A2A2E; border-radius: 999px; margin: 10px 8px"><span style="position: absolute; left: 8%; right: 34%; top: 0; bottom: 0; background: #C6FF3D; border-radius: 999px"></span><span style="position: absolute; left: 8%; top: -10px; width: 24px; height: 24px; margin-left: -12px; border-radius: 999px; background: #C6FF3D"></span><span style="position: absolute; left: 66%; top: -10px; width: 24px; height: 24px; margin-left: -12px; border-radius: 999px; background: #C6FF3D"></span></div>
        <div style="display: flex; gap: 10px"><span style="flex: 1; background: #18181B; border: 1px solid #2A2A2E; border-radius: 16px; padding: 10px 14px; display: flex; flex-direction: column"><span style="font-size: 11px; color: #A3A0A6">Mínimo</span><strong style="font-size: 16px">3.000 €</strong></span><span style="flex: 1; background: #18181B; border: 1px solid #2A2A2E; border-radius: 16px; padding: 10px 14px; display: flex; flex-direction: column"><span style="font-size: 11px; color: #A3A0A6">Máximo</span><strong style="font-size: 16px">20.000 €</strong></span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #A3A0A6">Combustible</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{fuels}}" as="f" hint-placeholder-count="5"><button type="button" style="{{f.style}}">{{f.label}}</button></sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #A3A0A6">Cambio</span>
        <div style="display: flex; background: #18181B; border: 1px solid #2A2A2E; border-radius: 999px; padding: 4px"><span style="flex: 1; text-align: center; padding: 10px; border-radius: 999px; background: #F4F2F0; color: #0F0F10; font-size: 14px; font-weight: 800">Todos</span><span style="flex: 1; text-align: center; padding: 10px; font-size: 14px; font-weight: 600">Manual</span><span style="flex: 1; text-align: center; padding: 10px; font-size: 14px; font-weight: 600">Automático</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #A3A0A6">Kilómetros y año</span>
        <div style="display: flex; gap: 10px"><span style="flex: 1; background: #18181B; border: 1px solid #2A2A2E; border-radius: 16px; padding: 12px 14px; font-size: 15px">Hasta 100.000 km</span><span style="flex: 1; background: #18181B; border: 1px solid #2A2A2E; border-radius: 16px; padding: 12px 14px; font-size: 15px">Desde 2017</span></div>
      </div>
    </div>
    <div style="padding: 14px 20px 28px; border-top: 1px solid #232326"><button type="button" style="all: unset; cursor: pointer; display: block; text-align: center; width: 100%; box-sizing: border-box; padding: 17px; border-radius: 999px; background: #C6FF3D; color: #0F0F10; font-family: Unbounded, sans-serif; font-size: 15px; font-weight: 800; text-transform: uppercase">Ver coches</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1970,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (on) => 'all: unset; cursor: pointer; padding: 10px 16px; border-radius: 999px; font-size: 14px; ' + (on ? 'font-weight: 800; background: #7C4DFF; color: #FAF9F8;' : 'font-weight: 600; border: 1px solid #2A2A2E; color: #F4F2F0;');
    const fuels = [['Gasolina', true], ['Diésel', true], ['Híbrido', false], ['Eléctrico', false], ['GLP', false]].map(([label, on]) => ({ label, style: chip(on) }));
    return { fuels };
  }
}
</script>
</body>
</html>
