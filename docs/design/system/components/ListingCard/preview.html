<!-- @dsCard group="Coches" height=420 subtitle="Normal, guardado y activo" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ListingCard</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&amp;family=Rethink+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:var(--space-6);background:var(--bg);color:var(--text);font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px var(--space-5);max-width:820px}
.card{display:flex;flex-direction:column;gap:var(--space-3)}
.photo{position:relative;aspect-ratio:20/19;border-radius:var(--radius-card);background:var(--photo-placeholder)}
.card.active .photo{box-shadow:0 0 0 2px var(--lime)}
.src{position:absolute;top:12px;left:12px;background:var(--scrim);border-radius:var(--radius-pill);padding:5px 10px;font-size:12px;font-weight:700}
.heart{all:unset;cursor:pointer;position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:var(--radius-pill);background:var(--scrim);color:var(--text);display:flex;align-items:center;justify-content:center}
.heart[aria-pressed="true"]{background:var(--violet);color:var(--on-violet)}
.top{display:flex;justify-content:space-between;gap:8px}
.t{font-size:16px;font-weight:700}
.m{font-size:14px;color:var(--text-muted)}
.p{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--lime);margin-top:6px}
</style>
</head>
<body>
<div class="grid">
  <article class="card"><div class="photo"><span class="src">Wallapop</span><button class="heart" type="button" aria-pressed="false" aria-label="Guardar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg></button></div><div><div class="top"><span class="t">Audi A3 2.0 TDI</span><span class="m">Madrid</span></div><div class="m">2018 · 95.000 km · Diésel</div><div class="p">14.500 €</div></div></article>
  <article class="card"><div class="photo"><span class="src">coches.net</span><button class="heart" type="button" aria-pressed="true" aria-label="Quitar de guardados"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg></button></div><div><div class="top"><span class="t">BMW Serie 3 320d</span><span class="m">Barcelona</span></div><div class="m">2019 · 120.000 km · Diésel</div><div class="p">18.900 €</div></div></article>
  <article class="card active"><div class="photo"><span class="src">Milanuncios</span><button class="heart" type="button" aria-pressed="false" aria-label="Guardar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg></button></div><div><div class="top"><span class="t">SEAT León 1.5 TSI</span><span class="m">Sevilla</span></div><div class="m">2020 · 64.000 km · Gasolina</div><div class="p">16.500 €</div></div></article>
</div>
</body>
</html>
