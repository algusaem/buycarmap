<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Wordmark</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:var(--space-6);background:var(--bg);color:var(--text);display:flex;gap:var(--space-12);align-items:center}
.w{font-family:var(--font-display);font-weight:900;letter-spacing:-.01em;color:var(--text);text-decoration:none}
.w span{color:var(--lime)}
</style>
</head>
<body>
<a class="w" href="#" style="font-size:20px">BUYCAR<span>MAP</span></a>
<a class="w" href="#" style="font-size:36px">BUYCAR<span>MAP</span></a>
</body>
</html>
