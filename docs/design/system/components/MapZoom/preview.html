<!-- @dsCard group="Mapa" height=160 subtitle="Zoom del mapa: acercar y alejar" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MapZoom</title>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
.map{position:relative;height:160px;background:var(--map-ground);overflow:hidden}
.zoom{position:absolute;right:18px;bottom:24px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-pill);overflow:hidden}
.zoom button{all:unset;cursor:pointer;width:42px;height:42px;text-align:center;font-size:20px;color:var(--text)}
.zoom button:first-child{border-bottom:1px solid var(--line)}
.zoom button:focus-visible{outline:2px solid var(--lime);outline-offset:-2px}
</style>
</head>
<body>
<div class="map">
  <div class="zoom"><button type="button" aria-label="Acercar">+</button><button type="button" aria-label="Alejar">−</button></div>
</div>
</body>
</html>
