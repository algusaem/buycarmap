<!-- @dsCard group="Mapa" height=260 subtitle="Zona de una alerta sobre el mapa oscuro" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AlertZone</title>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
.map{position:relative;height:260px;background:var(--map-ground);overflow:hidden}
.map svg{position:absolute;inset:0}
.road{stroke:var(--map-road);fill:none}
.major{stroke:var(--map-road-major);fill:none}
.water{fill:var(--map-water)}
.zone{fill:var(--lime);fill-opacity:.1;stroke:var(--lime);stroke-opacity:.8;stroke-width:2}
.centre{fill:var(--text);stroke:var(--bg);stroke-width:3}
.label{position:absolute;top:16px;left:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-pill);padding:10px 16px;font-size:14px;font-weight:700}
.label span{color:var(--lime)}
.pin{all:unset;cursor:pointer;position:absolute;padding:7px 13px;border-radius:var(--radius-pill);font-size:14px;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--text)}
.pin.on{background:var(--lime);color:var(--on-lime);border-color:var(--lime);font-weight:800;box-shadow:var(--shadow-pin-active)}
.pin:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
</style>
</head>
<body>
<div class="map" role="img" aria-label="Zona de la alerta Corolla híbrido, 50 km alrededor de Madrid, con tres coincidencias">
  <svg width="100%" height="260" viewBox="0 0 960 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path class="water" d="M-10 200 C 200 170 400 230 600 190 S 900 150 970 170 L 970 270 L -10 270 Z"/><path class="road" stroke-width="12" d="M-10 70 C 250 100 500 40 970 90"/><path class="major" stroke-width="10" d="M420 -10 C 450 90 480 170 460 270"/><path class="road" stroke-width="6" d="M720 -10 L 780 270"/><circle class="zone" cx="480" cy="140" r="110"/><circle class="centre" cx="480" cy="140" r="7"/></svg>
  <span class="label">Corolla híbrido · <span>Madrid · 50 km</span></span>
  <button class="pin on" type="button" style="left:400px;top:70px">16.200 €</button>
  <button class="pin" type="button" style="left:500px;top:110px">17.900 €</button>
  <button class="pin" type="button" style="left:430px;top:180px">15.300 €</button>
</div>
</body>
</html>
