<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>HeaderNav</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&amp;family=Rethink+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:var(--space-6) 0;background:var(--bg);color:var(--text);font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-6)}
header{height:80px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-8);border-bottom:1px solid var(--line-soft)}
header.open{padding:0 var(--space-12);border-bottom:0}
.w{font-family:var(--font-display);font-size:20px;font-weight:900;color:var(--text);text-decoration:none}
.w span{color:var(--lime)}
header.map{display:grid;grid-template-columns:1fr auto 1fr}
.map .w{justify-self:start}
.map nav{justify-self:end}
.search{display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-pill);padding:6px 6px 6px 8px}
.seg{all:unset;cursor:pointer;padding:6px 22px;display:flex;flex-direction:column;border-right:1px solid var(--line);white-space:nowrap}
.seg.price{border-right:0}
.k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.v{font-size:15px;font-weight:600}
.go{all:unset;cursor:pointer;width:46px;height:46px;border-radius:var(--radius-pill);background:var(--lime);color:var(--on-lime);display:flex;align-items:center;justify-content:center}
.secondary{all:unset;cursor:pointer;box-sizing:border-box;height:44px;padding:0 16px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius-pill);color:var(--text);font-size:14px;font-weight:700;white-space:nowrap}
nav{display:flex;align-items:center}
.map-nav{gap:10px}
.pages{gap:6px;font-size:15px;font-weight:700}
a{color:var(--text)}
a:hover{color:var(--lime)}
.link{text-decoration:none;padding:10px 16px;font-size:15px;font-weight:700;border-radius:var(--radius-pill)}
.link[aria-current="page"],.link[aria-current="page"]:hover{background:var(--text);color:var(--bg)}
.primary{text-decoration:none;padding:11px 20px;font-size:15px;font-weight:800;border-radius:var(--radius-pill);background:var(--lime);color:var(--on-lime)}
.primary:hover{color:var(--on-lime)}
.icon{all:unset;cursor:pointer;box-sizing:border-box;width:42px;height:42px;border:1px solid var(--line);border-radius:var(--radius-pill);display:flex;align-items:center;justify-content:center;color:var(--text)}
.av{width:42px;height:42px;border-radius:var(--radius-pill);background:var(--violet);color:var(--on-violet);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:15px;font-weight:800;text-decoration:none}
.av:hover{color:var(--on-violet)}
.pages .av{margin-left:8px}
.av[aria-current="page"]{box-shadow:var(--shadow-current)}
.phones{display:flex;gap:var(--space-6);padding:0 var(--space-8);flex-wrap:wrap}
.m{width:390px;height:64px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-5);border-bottom:1px solid var(--line-soft)}
.m.open{border-bottom:0}
.m .w{font-size:16px}
.m .left{display:flex;align-items:center;gap:12px}
.back{box-sizing:border-box;width:40px;height:40px;border-radius:var(--radius-pill);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
.m .txt{font-size:14px;font-weight:700;text-decoration:none}
.m .right{display:flex;align-items:center}
.lang{display:flex;align-items:center;font-family:var(--font-sans);font-size:13px;font-weight:600}
.lang button{all:unset;cursor:pointer;box-sizing:border-box;min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--text-muted)}
.lang button[aria-pressed="true"]{font-weight:800;color:var(--text)}
.lang span{color:var(--text-muted)}
.link:focus-visible,.primary:focus-visible,.secondary:focus-visible,.seg:focus-visible,.go:focus-visible,.icon:focus-visible,.av:focus-visible,.w:focus-visible,.txt:focus-visible,.back:focus-visible,.lang button:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
</style>
</head>
<body>
<header class="map">
  <a class="w" href="#">BUYCAR<span>MAP</span></a>
  <div class="search">
    <form class="pill" role="search" onsubmit="event.preventDefault()">
      <button class="seg" type="button"><span class="k">Dónde</span><span class="v">Madrid · 50 km</span></button>

    </form>
    <button class="secondary" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M15 8h6"/><path d="M18 5v6"/><path d="M20.002 14.464a9 9 0 0 0 .738.863A1 1 0 0 1 20 17H4a1 1 0 0 1-.74-1.673C4.59 13.956 6 12.499 6 8a6 6 0 0 1 8.75-5.332"/></svg>Crear alerta</button>
  </div>
  <nav class="map-nav" aria-label="Principal">
    <div class="lang" role="group" aria-label="Idioma"><button type="button" aria-pressed="true">ES</button><span aria-hidden="true">·</span><button type="button" aria-pressed="false">EN</button></div>
    <button class="icon" type="button" aria-label="Favoritos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg></button>
    <button class="icon" type="button" aria-label="Alertas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg></button>
    <a class="av" href="#" aria-label="Cuenta">A</a>
  </nav>
</header>
