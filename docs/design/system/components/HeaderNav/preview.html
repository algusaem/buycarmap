<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>HeaderNav</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&amp;family=Rethink+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:var(--space-6) 0;background:var(--bg);color:var(--text);font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-6)}
header{height:80px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-8);background:var(--surface)}
header.open{padding:0 var(--space-12);background:none}
.w{font-family:var(--font-display);font-size:20px;font-weight:900;color:var(--text);text-decoration:none}
.w span{color:var(--lime)}
header.map{height:auto;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:24px 48px 17px}
.row1{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:48px 34px;row-gap:28px;align-items:center}
.row2{height:34px;display:flex;align-items:center;justify-content:center;gap:8px}
.row1 .row2{grid-column:2}
header.laptop{width:1024px}
.laptop .top{height:48px;display:flex;align-items:center;justify-content:space-between}
.laptop .search{margin-top:20px;justify-content:center}
.laptop .row2{margin-top:28px}
.map .w{justify-self:start}
.map nav{justify-self:end}
.search{display:flex;align-items:center;gap:10px}
.pill{flex-shrink:0;height:48px;box-sizing:border-box;margin:0;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-pill);padding:5px 5px 5px 8px}
.seg{all:unset;cursor:pointer;padding:0 22px;display:flex;flex-direction:column;border-right:1px solid var(--line);white-space:nowrap}
.seg.price{border-right:0}
.k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.v{font-size:15px;font-weight:600}
.go{all:unset;cursor:pointer;width:36px;height:36px;border-radius:var(--radius-pill);background:var(--lime);color:var(--on-lime);display:flex;align-items:center;justify-content:center}
.secondary{all:unset;cursor:pointer;flex-shrink:0;box-sizing:border-box;height:40px;padding:0 16px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius-pill);color:var(--text);font-size:14px;font-weight:700;white-space:nowrap}
nav{display:flex;align-items:center}
.map-nav{gap:10px}
.pages{gap:6px;font-size:15px;font-weight:700}
a{color:var(--text)}
a:hover{color:var(--lime)}
.link{text-decoration:none;padding:10px 16px;font-size:15px;font-weight:700;border-radius:var(--radius-pill)}
.link[aria-current="page"],.link[aria-current="page"]:hover{background:var(--text);color:var(--bg)}
.primary{text-decoration:none;padding:11px 20px;font-size:15px;font-weight:800;border-radius:var(--radius-pill);background:var(--lime);color:var(--on-lime)}
.primary:hover{color:var(--on-lime)}
.quick{all:unset;cursor:pointer;flex-shrink:0;box-sizing:border-box;height:34px;padding:0 14px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius-pill);color:var(--text);font-size:13px;font-weight:700;white-space:nowrap}
.quick[aria-pressed]{font-weight:600}.quick[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--on-violet);font-weight:800}
.divider{flex-shrink:0;width:1px;height:24px;background:var(--line);margin:0 4px}
.av{width:42px;height:42px;border-radius:var(--radius-pill);background:var(--violet);color:var(--on-violet);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:15px;font-weight:800;text-decoration:none}
.av:hover{color:var(--on-violet)}
.pages .av{margin-left:8px}
.av[aria-current="page"]{box-shadow:var(--shadow-current)}
.phones{display:flex;gap:var(--space-6);padding:0 var(--space-8);flex-wrap:wrap}
.m{width:390px;height:64px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-5);background:var(--surface)}
.m.open{background:none}
.m .w{font-size:16px}
.m .left{display:flex;align-items:center;gap:12px}
.back{box-sizing:border-box;width:40px;height:40px;border-radius:var(--radius-pill);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
.m .txt{font-size:14px;font-weight:700;text-decoration:none}
.m .right{display:flex;align-items:center}
.lang{display:flex;align-items:center;font-family:var(--font-sans);font-size:13px;font-weight:600}
.lang button{all:unset;cursor:pointer;box-sizing:border-box;min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--text-muted)}
.lang button[aria-pressed="true"]{font-weight:800;color:var(--text)}
.lang span{color:var(--text-muted)}
.link:focus-visible,.primary:focus-visible,.secondary:focus-visible,.seg:focus-visible,.go:focus-visible,.quick:focus-visible,.av:focus-visible,.w:focus-visible,.txt:focus-visible,.back:focus-visible,.lang button:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
</style>
</head>

        <button class="go" type="submit" aria-label="Buscar"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      </form>
      <button class="secondary" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M15 8h6"/><path d="M18 5v6"/><path d="M20.002 14.464a9 9 0 0 0 .738.863A1 1 0 0 1 20 17H4a1 1 0 0 1-.74-1.673C4.59 13.956 6 12.499 6 8a6 6 0 0 1 8.75-5.332"/></svg>Crear alerta</button>
    </div>
    <nav class="pages" aria-label="Principal">
      <div class="lang" role="group" aria-label="Idioma"><button type="button" aria-pressed="true">ES</button><span aria-hidden="true">·</span><button type="button" aria-pressed="false">EN</button></div>
      <a class="link" href="#" aria-current="page">Mapa</a>
      <a class="link" href="#">Guardados</a>
      <a class="link" href="#">Alertas</a>
      <a class="av" href="#" aria-label="Cuenta">A</a>
    </nav>
    <div class="row2" role="group" aria-label="Filtros rápidos">
      <button class="quick" type="button" aria-haspopup="dialog"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Filtros</button>
      <span class="divider" aria-hidden="true"></span>
      <button class="quick" type="button" aria-pressed="false">Gasolina</button>
      <button class="quick" type="button" aria-pressed="false">Diésel</button>
      <button class="quick" type="button" aria-pressed="false">Manual</button>
      <button class="quick" type="button" aria-pressed="false">Automático</button>
      <button class="quick" type="button" aria-pressed="false">Hasta 100.000 km</button>
    </div>
  </div>
</header>
