<style>
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:var(--font-sans);display:flex;gap:56px;align-items:flex-start;flex-wrap:wrap}
.toc{width:260px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--text-muted)}

.toc a[aria-current="location"],.list a[aria-current="location"]{color:var(--text);border-left:2px solid var(--lime);padding-left:12px}
.toc a:focus-visible,.list a:focus-visible,.fold:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.mobile{width:350px;display:flex;flex-direction:column;gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-field);overflow:hidden}
.fold{all:unset;cursor:pointer;box-sizing:border-box;width:100%;padding:12px 16px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.list{display:flex;flex-direction:column;padding:4px 16px 10px;border-top:1px solid var(--line-soft);font-size:14px;font-weight:600}
