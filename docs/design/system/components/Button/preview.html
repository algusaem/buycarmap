<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Button</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&amp;family=Rethink+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:var(--space-6);background:var(--bg);color:var(--text);font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-5)}
.row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;box-sizing:border-box;border-radius:var(--radius-pill);display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.primary{background:var(--lime);color:var(--on-lime);font-weight:800}
.display{width:440px;height:56px;font-family:var(--font-display);font-size:15px;text-transform:uppercase}
.h54{height:54px;padding:0 24px;gap:7px;font-size:16px}
.h52{width:338px;height:52px;font-size:16px}
.h48{height:48px;padding:0 22px;font-size:15px}
.h42{height:42px;padding:0 16px;font-size:14px}
.h42 svg{margin-left:6px;flex-shrink:0}
.sm15{padding:11px 20px;font-size:15px}
.sm14{padding:10px 16px;font-size:14px}
.secondary{border:1px solid var(--line);color:var(--text);font-weight:700}
.s48{height:48px;padding:0 20px;font-size:15px}
.s44{height:44px;padding:0 18px;font-size:14px}
.s-pad{padding:10px 16px;font-size:14px}
.s-icon{padding:10px 16px;font-size:14px;gap:8px}
.count{background:var(--violet);color:var(--on-violet);border-radius:var(--radius-pill);padding:1px 8px;font-size:12px;font-weight:800}
.ghost{color:var(--text);font-weight:700}
.g-nav{padding:10px 16px;font-size:15px}
.g-undo{height:48px;padding:0 14px;font-size:15px}
.g-undo:hover,.g-undo:focus-visible{color:var(--danger)}
.danger{height:44px;padding:0 18px;font-size:14px;font-weight:700;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 60%,transparent)}
.text{all:unset;cursor:pointer;font-size:14px;font-weight:700;text-decoration:underline;color:var(--text)}
.link{font-size:14px;font-weight:700;color:var(--lime)}
.link:hover{color:var(--lime)}
.icon{all:unset;cursor:pointer;box-sizing:border-box;width:42px;height:42px;border-radius:var(--radius-pill);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.icon.saved{background:var(--violet);border:0;color:var(--on-violet)}
.icon.i40{width:40px;height:40px}
.btn:focus-visible,.icon:focus-visible,.text:focus-visible,.link:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
</style>
</head>
<body>
<div class="row">
  <button class="btn primary display" type="button">Entrar</button>
  <button class="btn primary h54" type="button"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Buscar</button>
  <button class="btn primary h52" type="button">Buscar</button>
</div>
<div class="row">
  <a class="btn primary h48" href="#">Ampliar a 100 km</a>
  <a class="btn primary h42" href="#">Ver anuncio<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></a>
  <a class="btn primary sm15" href="#">Crear cuenta</a>
  <a class="btn primary sm14" href="#">Nueva alerta</a>
</div>
<div class="row">
  <a class="btn secondary s48" href="#">Volver al mapa</a>
  <a class="btn secondary s44" href="#">Cambiar correo</a>
  <a class="btn secondary s-pad" href="#">Cerrar sesión</a>
  <button class="btn secondary s-icon" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Filtros <span class="count">3</span></button>
  <a class="btn danger" href="#">Eliminar mi cuenta</a>
</div>
<div class="row">
  <a class="btn ghost g-nav" href="#">Crear alerta</a>
  <a class="btn ghost g-nav" href="#">Entrar</a>
  <a class="btn ghost g-undo" href="#">Quitar filtros</a>
  <button class="text" type="button">Borrar</button>
  <span style="font-size:14px;color:var(--text-muted)">¿No tienes cuenta? <a class="link" href="#">Créala</a></span>
</div>
<div class="row">
  <button class="icon" type="button" aria-label="Guardar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg></button>
  <button class="icon saved" type="button" aria-label="Quitar de guardados"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg></button>
  <button class="icon i40" type="button" aria-label="Cerrar filtros"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
</body>
</html>
