<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Button</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&amp;family=Rethink+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:var(--space-6);background:var(--bg);color:var(--text);font-family:var(--font-sans)}
.row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;height:44px;padding:0 var(--space-5);border-radius:var(--radius-pill);font-size:15px;font-weight:800;display:inline-flex;align-items:center;gap:var(--space-2)}
.primary{background:var(--lime);color:var(--on-lime)}
.secondary{border:1px solid var(--line);color:var(--text);font-weight:700}
.ghost{color:var(--text);font-weight:700;padding:0 var(--space-4)}
.icon{all:unset;cursor:pointer;width:42px;height:42px;border-radius:var(--radius-pill);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.btn:focus-visible,.icon:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
</style>
</head>
<body>
<div class="row">
  <button class="btn primary" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Buscar</button>
  <a class="btn primary" href="#">Ver anuncio<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left: 6px; flex-shrink: 0"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></a>
  <button class="btn secondary" type="button">Filtros</button>
  <a class="btn ghost" href="#">Crear alerta</a>
  <button class="icon" type="button" aria-label="Guardar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg></button>
</div>
</body>
</html>
