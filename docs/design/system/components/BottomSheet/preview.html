<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BottomSheet</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&amp;family=Rethink+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--map-ground);color:var(--text);font-family:var(--font-sans)}
.stage{position:relative;width:390px;height:640px;margin:0 auto;overflow:hidden;background:var(--map-ground)}
.sheet{position:absolute;left:0;right:0;bottom:0;height:520px;box-sizing:border-box;background:var(--surface);border-top:1px solid var(--line);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;padding:10px var(--space-5) 0;display:flex;flex-direction:column;gap:14px}
.handle{all:unset;cursor:pointer;align-self:center;padding:6px 20px;margin:-6px 0}
.handle span{display:block;width:40px;height:5px;border-radius:var(--radius-pill);background:var(--handle)}
.handle:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:var(--radius-pill)}
.n{align-self:center;font-family:var(--font-display);font-size:15px;font-weight:800;text-transform:uppercase}
.photo{position:relative;flex-shrink:0;height:250px;border-radius:var(--radius-card);background:var(--photo-placeholder);display:flex;align-items:center;justify-content:center;color:var(--photo-icon)}
.src{position:absolute;top:12px;left:12px;background:var(--scrim);color:var(--text);border-radius:var(--radius-pill);padding:5px 10px;font-size:12px;font-weight:700}
.top{display:flex;justify-content:space-between}
.t{font-size:16px;font-weight:700}
.m{font-size:14px;color:var(--text-muted)}
.meta{margin-top:-10px}
.p{font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--lime)}
</style>
</head>
<body>
<div class="stage">
  <section class="sheet" aria-label="Resultados">
    <button class="handle" type="button" aria-expanded="false" aria-label="Mostrar lista"><span></span></button>
    <strong class="n">Cerca de Madrid</strong>
    <div class="photo"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg><span class="src">Milanuncios</span></div>
    <div class="top"><strong class="t">SEAT León 1.5 TSI FR</strong><span class="m">Sevilla</span></div>
    <span class="m meta">2020 · 64.000 km · Gasolina</span>
    <strong class="p">16.500 €</strong>
  </section>
</div>
</body>
</html>
