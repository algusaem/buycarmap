<!-- @dsCard height=288 -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BuyCarMap</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&amp;family=Rethink+Sans:wght@400&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);overflow:hidden}
.cover{position:relative;width:960px;height:288px;overflow:hidden}
.band{position:absolute;top:0;left:0;width:960px;height:112px}
.lime{fill:var(--lime)}
.surface{fill:var(--surface)}
.ground{fill:var(--map-ground)}
.water{fill:var(--map-water)}
.road{stroke:var(--map-road-major);fill:none}
.pin{fill:var(--surface);stroke:var(--line);stroke-width:1}
.pin.on{fill:var(--lime);stroke:none}
.halo{fill:var(--lime-glow)}
.words{position:absolute;left:var(--space-8);bottom:var(--space-8);max-width:440px}
.name{margin:0;font-family:var(--font-display);font-size:64px;font-weight:900;line-height:.95;letter-spacing:-.01em;color:var(--text)}
.tag{margin:var(--space-2) 0 0 2px;font-size:14px;line-height:20px;color:var(--text-muted)}
</style>
</head>
<body>
<div class="cover">
<svg class="band" viewBox="0 0 960 112" width="960" height="112" aria-hidden="true">
<!--
  blocks      lime 224 wide (the one light, largest) · map-ground 448 wide holding the map · map-water 128 · surface 160 bleeding off the right — a full-width top band 112 tall
  arrangement one strip of unequal bands, flush, like the split screen: accent, map, water, panel
  pattern     price pins, from "the pins are pills with the price; the active one turns lime with a halo": six radius-pill pills at a space-12 pitch over the map band, one lime with its halo
  scales      pill 64×24 (rx 12 = half its height, radius-pill); pitch space-12 (48) plus gaps of space-6; band height space-12 + space-16
-->
<rect class="lime" x="0" y="0" width="224" height="112"/>
<rect class="ground" x="224" y="0" width="448" height="112"/>
<path class="road" stroke-width="10" d="M224 78 C 330 60 430 96 672 52"/>
<rect class="water" x="672" y="0" width="128" height="112"/>
<rect class="surface" x="800" y="0" width="160" height="112"/>
<rect class="pin" x="256" y="24" width="64" height="24" rx="12"/>
<rect class="pin" x="344" y="64" width="64" height="24" rx="12"/>
<circle class="halo" cx="464" cy="44" r="26"/>
<rect class="pin on" x="432" y="32" width="64" height="24" rx="12"/>
<rect class="pin" x="528" y="70" width="64" height="24" rx="12"/>
<rect class="pin" x="592" y="16" width="64" height="24" rx="12"/>
</svg>
<div class="words">
<h1 class="name">BuyCarMap</h1>
<p class="tag">Todos los coches de segunda mano, en un mapa.</p>
</div>
</div>
</body>
</html>
