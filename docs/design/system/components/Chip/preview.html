<!-- @dsCard group="Filtros" height=386 subtitle="Chips: Filtros y los filtros rápidos (sin pulsar y pulsados), sin criterios, la banda del móvil con Filtros redondo, el chip de la marca que se quita, panel de filtros y orden" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Chip</title>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:var(--space-6);background:var(--bg);color:var(--text);font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-6)}
.row{display:flex;gap:var(--space-2);align-items:center}
.wrap{flex-wrap:wrap}
.chip{all:unset;cursor:pointer;padding:9px 16px;border-radius:var(--radius-pill);font-size:14px;font-weight:600;border:1px solid var(--line);color:var(--text);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--violet);color:var(--on-violet);border:0;font-weight:800}
.filters{all:unset;cursor:pointer;flex-shrink:0;box-sizing:border-box;height:34px;display:flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--line);border-radius:var(--radius-pill);font-size:13px;font-weight:700;white-space:nowrap}
.divider{flex-shrink:0;width:1px;height:24px;background:var(--line);margin:0 4px}
.quick{all:unset;cursor:pointer;flex-shrink:0;box-sizing:border-box;height:34px;padding:0 14px;display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius-pill);color:var(--text);font-size:13px;font-weight:600;white-space:nowrap}
.quick[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--on-violet);font-weight:800}
.round{all:unset;cursor:pointer;position:relative;flex-shrink:0;box-sizing:border-box;width:44px;height:44px;border:1px solid var(--line);border-radius:var(--radius-pill);color:var(--text);display:flex;align-items:center;justify-content:center}
.round .count{position:absolute;top:-4px;right:-4px}
.count{background:var(--violet);color:var(--on-violet);border-radius:var(--radius-pill);padding:1px 8px;font-size:12px;font-weight:800}
.active{display:inline-flex;align-items:center;height:36px;box-sizing:border-box;padding-left:16px;border-radius:var(--radius-pill);background:var(--violet);color:var(--on-violet);font-size:14px;font-weight:800;white-space:nowrap}
.remove{all:unset;cursor:pointer;box-sizing:border-box;width:44px;height:44px;margin:-4px 0 -4px -4px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-pill);color:var(--on-violet)}
.band{width:390px;box-sizing:border-box;padding:20px 0 12px;background:var(--surface);display:flex;flex-direction:column;gap:16px}
.band .top{display:flex;justify-content:flex-end;padding:0 16px}
.band .scroll{display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none;padding:0 16px}
.sheet{width:350px}
.sheet .chip{padding:10px 16px}
.chip:focus-visible,.filters:focus-visible,.quick:focus-visible,.round:focus-visible,.remove:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
</style>
</head>
<body>
<div class="row" role="group" aria-label="Filtros rápidos">
  <button class="filters" type="button" aria-haspopup="dialog"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Filtros <span class="count">4</span></button>
  <span class="divider" aria-hidden="true"></span>
  <button class="quick" type="button" aria-pressed="false">Gasolina</button>
  <button class="quick" type="button" aria-pressed="true">Diésel</button>
  <button class="quick" type="button" aria-pressed="false">Manual</button>
  <button class="quick" type="button" aria-pressed="true">Automático</button>
  <button class="quick" type="button" aria-pressed="false">Hasta 100.000 km</button>
</div>
<div class="row" role="group" aria-label="Filtros rápidos">
  <button class="filters" type="button" aria-haspopup="dialog"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Filtros</button>
  <span class="divider" aria-hidden="true"></span>
  <button class="quick" type="button" aria-pressed="false">Gasolina</button>
  <button class="quick" type="button" aria-pressed="false">Diésel</button>
  <button class="quick" type="button" aria-pressed="false">Manual</button>
  <button class="quick" type="button" aria-pressed="false">Automático</button>
  <button class="quick" type="button" aria-pressed="false">Hasta 100.000 km</button>
</div>
<div class="row wrap" style="gap:var(--space-6);align-items:flex-start">
  <div class="band">
    <div class="top"><button class="round" type="button" aria-haspopup="dialog" aria-label="Filtros"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="count" aria-hidden="true">4</span></button></div>
    <div class="scroll" role="group" aria-label="Filtros rápidos">
      <button class="quick" type="button" aria-pressed="false">Gasolina</button>
      <button class="quick" type="button" aria-pressed="true">Diésel</button>
      <button class="quick" type="button" aria-pressed="false">Manual</button>
      <button class="quick" type="button" aria-pressed="true">Automático</button>
      <button class="quick" type="button" aria-pressed="false">Hasta 100.000 km</button>
    </div>
  </div>
  <div class="row">
    <span class="active">Toyota<button class="remove" type="button" aria-label="Quitar Toyota"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></span>
  </div>
  <div class="row wrap sheet">
    <button class="chip" type="button" aria-pressed="true">Gasolina</button>
    <button class="chip" type="button" aria-pressed="true">Diésel</button>
    <button class="chip" type="button" aria-pressed="false">Híbrido</button>
    <button class="chip" type="button" aria-pressed="false">Eléctrico</button>
    <button class="chip" type="button" aria-pressed="false">GLP</button>
  </div>
</div>
<div class="row" role="group" aria-label="Ordenar">
  <button class="chip" type="button" aria-pressed="true">Recientes</button>
  <button class="chip" type="button" aria-pressed="false">Precio</button>
  <button class="chip" type="button" aria-pressed="false">Km</button>
</div>
</body>
</html>
