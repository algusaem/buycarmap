<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Headline</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&amp;family=Rethink+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:var(--space-8);background:var(--bg);color:var(--text);font-family:var(--font-sans)}
.h{margin:0;font-family:var(--font-display);font-size:72px;font-weight:900;line-height:1.04;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance;text-box:trim-both cap alphabetic}
.q{display:block;font-size:.56em;line-height:1.1;letter-spacing:0;margin-bottom:.22em}
.a{display:block;color:var(--lime)}
.lead{margin:var(--space-6) 0 0;max-width:560px;font-size:19px;line-height:1.5;color:var(--text-muted)}
</style>
</head>
<body>
<h1 class="h"><span class="q">¿En busca de coche?</span><span class="a">Mira el mapa</span></h1>
<p class="lead">Una web, toda la segunda mano, sin cincuenta pestañas.</p>
</body>
</html>
