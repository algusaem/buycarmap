<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>BottomNav</title>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:var(--space-6) var(--space-4);background:var(--bg);color:var(--text);font-family:var(--font-sans);display:flex;flex-direction:column;gap:var(--space-6)}
nav{width:358px;box-sizing:border-box;margin:0 auto;height:62px;border-radius:var(--radius-pill);background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-around}
a{color:var(--text);text-decoration:none;font-size:13px;font-weight:700;border-radius:var(--radius-pill)}
a[aria-current="page"]{background:var(--violet);color:var(--on-violet);padding:10px 16px}
a:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
</style>
</head>
<body>
<nav aria-label="Principal">
  <a href="#">Mapa</a>
  <a href="#" aria-current="page">Guardados</a>
  <a href="#">Alertas</a>
</nav>
<nav aria-label="Principal">
  <a href="#">Mapa</a>
  <a href="#">Guardados</a>
  <a href="#">Alertas</a>
</nav>
</body>
</html>
