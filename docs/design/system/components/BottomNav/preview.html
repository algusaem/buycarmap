<meta charset="utf-8">
<title>BottomNav</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&amp;family=Rethink+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:var(--space-6) var(--space-4);background:var(--bg);color:var(--text);font-family:var(--font-sans);display:flex;flex-direction:column;align-items:center;gap:var(--space-4)}
.bar{width:390px;box-sizing:border-box;height:99px;padding-bottom:34px;background:var(--surface);border-top:1px solid var(--line);display:flex}
.bar a{flex:1 1 0;min-width:0;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--text-muted)}
.bar a span{font-size:11px;font-weight:600;line-height:13px;white-space:nowrap}
.bar a[aria-current="page"] span{font-weight:800}
.bar a[aria-current="page"]{color:var(--violet)}
.bar .av{width:22px;height:22px;box-sizing:border-box;border-radius:var(--radius-pill);border:1.5px solid var(--text-muted);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:11px;font-weight:800;font-style:normal;line-height:1}
.bar a[aria-current="page"] .av{border:0;background:var(--violet);color:var(--on-violet)}
.bar a:focus-visible{outline:2px solid var(--lime);outline-offset:-2px;border-radius:var(--radius-field)}
</style>
