<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PasswordField</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&amp;family=Rethink+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:24px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
label{display:flex;flex-direction:column;gap:8px;width:420px}span.l{font-size:13px;font-weight:700}.f{height:52px;box-sizing:border-box;border-radius:var(--radius-field);border:1px solid var(--line);background:var(--bg);padding:0 16px;display:flex;align-items:center;font-size:16px}.m{display:flex;gap:6px;width:420px;margin-top:8px}.m i{flex:1;height:4px;border-radius:var(--radius-pill);background:var(--line)}.m i.on{background:var(--lime)}small{display:block;margin-top:8px;font-size:12px;color:var(--text-muted)}small b{color:var(--text)}
</style>
</head>
<body>
<div><label><span class="l">Contraseña</span><span class="f">••••••••••</span></label><div class="m"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div><small>Seguridad: <b>buena</b></small></div>
</body>
</html>
