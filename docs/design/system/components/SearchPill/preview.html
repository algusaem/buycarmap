<!-- @dsCard group="Filtros" height=120 subtitle="Buscador píldora: Dónde · Coche · Precio" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SearchPill</title>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;padding:var(--space-6);background:var(--bg);color:var(--text);font-family:var(--font-sans)}
.pill{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-pill);padding:6px 6px 6px 8px}
.seg{all:unset;cursor:pointer;padding:6px 22px;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.seg:last-of-type{border-right:0}
.k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.v{font-size:15px;font-weight:600}
.v.empty{color:var(--text-muted)}
.go{all:unset;cursor:pointer;width:46px;height:46px;border-radius:var(--radius-pill);background:var(--lime);color:var(--on-lime);display:flex;align-items:center;justify-content:center}
.seg:focus-visible,.go:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:var(--radius-field)}
</style>
</head>
<body>
<form class="pill" role="search" onsubmit="event.preventDefault()">
  <button class="seg" type="button"><span class="k">Dónde</span><span class="v">Madrid · 50 km</span></button>
  <button class="seg" type="button"><span class="k">Coche</span><span class="v empty">Marca o modelo…</span></button>
  <button class="seg" type="button"><span class="k">Precio</span><span class="v">Hasta 20.000 €</span></button>
  <button class="go" type="submit" aria-label="Buscar"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
</form>
</body>
</html>
