<!-- @dsCard group="Formularios" height=400 subtitle="Selector abierto, siempre con casillas: una marca y varios combustibles" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Select</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&amp;family=Rethink+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:24px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.f{width:340px;display:flex;flex-direction:column;gap:8px}.l{font-size:13px;font-weight:700}.tr{height:52px;box-sizing:border-box;border-radius:var(--radius-field);border:1px solid var(--lime);background:var(--bg);padding:0 14px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px}.lb{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-field);padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow-float)}.o{height:44px;box-sizing:border-box;padding:0 12px 0 14px;border-radius:var(--radius-option);display:flex;align-items:center;justify-content:flex-start;gap:12px;font-size:15px;font-weight:500}.o.h{background:var(--surface-strong)}.o[aria-selected="true"]{font-weight:700}.tr span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bx{width:20px;height:20px;box-sizing:border-box;border-radius:6px;border:1.5px solid var(--text-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}.o[aria-selected="true"] .bx{background:var(--violet);border-color:var(--violet)}.o[aria-selected="true"] .bx svg{color:var(--on-violet);width:14px;height:14px}
</style>
</head>
<body>
<div class="f"><span class="l">Marca</span><span class="tr"><span>Toyota</span><svg class="" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span><div class="lb" role="listbox" aria-multiselectable="true"><div class="o h" role="option" aria-selected="false"><span class="bx"></span>Seat</div><div class="o" role="option" aria-selected="true"><span class="bx"><svg class="" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Toyota</div><div class="o" role="option" aria-selected="false"><span class="bx"></span>Volkswagen</div></div></div><div class="f"><span class="l">Combustible</span><span class="tr"><span>Gasolina, Diésel, Híbrido</span><svg class="" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span><div class="lb" role="listbox" aria-multiselectable="true"><div class="o" role="option" aria-selected="true"><span class="bx"><svg class="" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Gasolina</div><div class="o" role="option" aria-selected="true"><span class="bx"><svg class="" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Diésel</div><div class="o" role="option" aria-selected="true"><span class="bx"><svg class="" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Híbrido</div><div class="o h" role="option" aria-selected="false"><span class="bx"></span>Eléctrico</div><div class="o" role="option" aria-selected="false"><span class="bx"></span>GLP</div></div></div>
</body>
</html>
