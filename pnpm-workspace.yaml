allowBuilds:
  '@prisma/engines': true
  prisma: true
  msw: true
  sharp: true
  esbuild: false
  ssh2: false
  cpu-features: false
  protobufjs: false
  # next-intl's plugin is not used; see ADR 0016.
  '@swc/core': false
  '@parcel/watcher': false
  # Guidepup's macOS setup records the screen with it, optionally; the NVDA
  # suite on Windows never loads it (ADR 0024).
  ffmpeg-static: false

# Dependabot-alert patches for transitive deps the parents still pin below the
# patched version. Each stays within the parent's major; `pnpm update --depth
# Infinity` alone could not clear these because the parent pins an exact
# version rather than a range.
overrides:
  '@hono/node-server@<1.19.15': ^2.0.0
  'valibot@<1.4.2': ^1.4.2
  'mysql2@<3.23.1': ^3.23.1
  'handlebars@<4.7.10': ^4.7.10
  'source-map-js@<1.2.2': ^1.2.2
