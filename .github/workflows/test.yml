name: Test

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly upstream-drift check against the real Wallapop/coches.net APIs.
    - cron: "0 4 * * *"

# Dummy values so `prisma generate` + `next build` don't fail on missing env —
# lib/env.ts validates these at import and refuses to boot without them.
# Nothing here connects to a real database or signs a real token. The secret is
# padded past 32 characters only to keep the length warning out of CI logs.
env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
  NEXTAUTH_SECRET: "ci-test-secret-at-least-32-characters"
  NEXTAUTH_URL: "http://localhost:3000"

jobs:
  unit:
    name: Unit / integration / component / contract
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Every acceptance criterion in an approved spec must still be named by a
      # test title. Runs before the suite: it is a static check and fails fast.
      - run: pnpm spec:check
      # Links, referenced source paths and the ownership map. Also static, also
      # fails fast — and it runs before `prisma generate` on purpose, so that a
      # fresh clone with no app/generated/prisma is the state it is proven under.
      - run: pnpm docs:check
      - run: pnpm exec prisma generate
      - run: pnpm test:coverage

  e2e:
    name: End-to-end (Playwright)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # next dev imports the generated Prisma client; without it every page
      # renders the Module-not-found overlay and nearly every test fails behind it.
      - run: pnpm exec prisma generate
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  contract-live:
    name: Upstream contract (live)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract:live
