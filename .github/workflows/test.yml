name: Test

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly upstream-drift check against the real Wallapop/coches.net APIs.
    - cron: "0 4 * * *"

permissions:
  contents: read

# Dummy values so `prisma generate` + `next build` don't fail on missing env —
# lib/env.ts validates these at import and refuses to boot without them.
# Nothing here connects to a real database or signs a real token. The secret is
# padded past 32 characters only to keep the length warning out of CI logs.
env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
  BETTER_AUTH_SECRET: "ci-test-secret-at-least-32-characters"
  BETTER_AUTH_URL: "http://localhost:3000"

jobs:
  check:
    name: Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck and tests import the generated client
      - run: pnpm exec prisma generate
      - run: pnpm check

  gitleaks:
    name: Secrets (gitleaks)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # gitleaks-action's own GITHUB_TOKEN use is a pulls-create-review-comment
    # call to comment on the PR (its README, "Environment Variables" ›
    # GITHUB_TOKEN) — contents: read for the checkout below, pull-requests:
    # write for that comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: End-to-end (Playwright)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # next dev imports the generated Prisma client; without it every page
      # renders the Module-not-found overlay and nearly every test fails behind it.
      - run: pnpm exec prisma generate
      # Every project but the two WebKit ones, which run in e2e-webkit below.
      - run: pnpm exec playwright test --project=chromium --project=mobile --project=visual
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # docs/specs/a11y-checks.md (A11Y-15, A11Y-16): the WebKit projects, in a job
  # of their own that is not a required check until they pass here reliably.
  e2e-webkit:
    name: End-to-end (WebKit)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm exec prisma generate
      - run: pnpm exec playwright test --project=webkit-iphone --project=webkit-desktop
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 7

  contract-live:
    name: Upstream contract (live)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract:live
