name: alerts

# Polls the three sources for saved searches and emails what is new.
#
# The whole job is one HTTP request per matrix leg — the fan-out over criteria
# happens inside the handler — so its cost does not grow with the number of
# alerts. Five minutes is GitHub's floor for a schedule; nothing shorter is
# expressible.
#
# Scheduled runs drift under load, sometimes by several minutes, so this is an
# approximate cadence rather than a guarantee. The response's
# `oldestPendingAgeMs` is what makes a slipping lap visible.
#
# Reasoning: docs/decisions/0006-alert-scheduling.md
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# A run that overlaps the previous one adds nothing: the queue is claimed with
# SKIP LOCKED, so a second drain would find the same jobs already taken.
concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    strategy:
      # Parallel workers. Raising this is the lever that keeps lap time flat as
      # the number of distinct criteria grows — each leg drains its own slice.
      matrix:
        worker: [1, 2]
      fail-fast: false
    steps:
      - name: Drain the alert queue
        env:
          APP_URL: ${{ secrets.APP_URL }}
          ALERTS_CRON_SECRET: ${{ secrets.ALERTS_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$ALERTS_CRON_SECRET" ]; then
            echo "APP_URL or ALERTS_CRON_SECRET is unset — alerts are not configured."
            exit 0
          fi

          # --fail-with-body so a non-2xx fails the step but still prints why.
          curl --silent --show-error --fail-with-body \
            --max-time 120 \
            -X POST "$APP_URL/api/alerts/run" \
            -H "Authorization: Bearer $ALERTS_CRON_SECRET"
