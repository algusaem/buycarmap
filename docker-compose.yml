# Local Postgres for development and `pnpm db:branch`'s per-branch databases.
# Matches the major version Neon runs (17.11 measured 2026-09-30) so what
# passes locally runs in production. Published on 5433, not 5432, so it never
# collides with a Postgres already running on the default port.
#
# pnpm db:up    # start (pnpm db:up)
# pnpm db:down  # stop, keeping the volume — every branch database lives in it

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buycarmap
    ports:
      - "5433:5432"
    volumes:
      - buycarmap-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  buycarmap-postgres:
